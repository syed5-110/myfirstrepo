services:
  - type: web
    name: restaurant-pos
    runtime: python
    buildCommand: ""
    startCommand: "python3 server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATA_DIR
        value: "/var/data"
    disk:
      name: restaurant-pos-data
      mountPath: /var/data
      sizeGB: 1
